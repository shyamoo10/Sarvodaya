name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sarvodaya
          POSTGRES_PASSWORD: sarvodaya
          POSTGRES_DB: sarvodaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sarvodaya -d sarvodaya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sarvodaya:sarvodaya@localhost:5432/sarvodaya_test?schema=public
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-for-validation
      OTP_HASH_SECRET: ci-otp-hash-secret-that-is-long-enough-too
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # npm install also honours package-lock.json when one is committed.
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
